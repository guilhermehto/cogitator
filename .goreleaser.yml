version: 2

project_name: cogitator

# The zellij plugin wasm is OS-independent: build it once and embed it in
# every binary (bundledplugin tag), so users never need a Rust toolchain.
before:
  hooks:
    - make plugin-bundle

builds:
  - id: cogitator
    main: ./cmd/cogitator
    binary: cogitator
    flags:
      - -tags=bundledplugin
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

brews:
  - repository:
      owner: guilhermehto
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/guilhermehto/cogitator
    description: Monitor coding agents, spin up git worktrees, and jump between them from tmux or zellij
    license: MIT
    test: |
      system "#{bin}/cogitator", "--status"
